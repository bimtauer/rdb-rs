name: Rust CD

# Publishes the crate to crates.io via trusted publishing, then creates the
# GitHub Release. The crates.io trusted publisher is bound to this file name
# and the `release` environment (v* tags only, required approval).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: release
      url: https://crates.io/crates/rdb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Check CHANGELOG.md has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release-notes.sh "${TAG#v}" > /dev/null
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Create release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          .github/scripts/release-notes.sh "${TAG#v}" > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
