[package]
name = "rdb"
edition = "2024"
rust-version = "1.87"
version = "0.4.0"
authors = ["Jan-Erik Rediger <badboy@fnordig.de>", "Tim Bauer <timderbauer@gmail.com>"]
keywords = ["redis", "database", "rdb", "parser"]
categories = ["database", "parser-implementations", "command-line-utilities"]
description = "Fast parser for Redis RDB dump files: library, CLI and Python bindings"
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/rdb/"
repository = "https://github.com/bimtauer/rdb-rs"

include = [
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/src/**/*.rs",
  "/tests/*.rs",
  "/tests/dumps/*.rdb",
  "/tests/dumps/README.md",
  "/tests/dumps/json/*",
  "/tests/dumps/plain/*",
  "/tests/dumps/protocol/*",
]

[[bin]]
name = "rdb"
path = "src/main.rs"
doc  = false

[lib]
name = "rdb"
crate-type = ["cdylib", "rlib"]

[dependencies]
lzf = "1.0"
regex = "1.13"
byteorder = "1.5"
thiserror = "2.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
clap = { version = "4.6", features = ["derive"] }
indexmap = "2.14"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
pretty_assertions = "1.4"
redis = "1.7"
rstest = "0.27"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis"] }
tempfile = "3.27"
assert_cmd = "2.2"

[features]
default = []
python = ["pyo3"]
