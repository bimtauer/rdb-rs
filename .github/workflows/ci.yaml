name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # Called by rust-cd.yaml to gate releases on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # Nightly breakage should be visible but must not block merges or releases.
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # Includes the Redis container matrix (testcontainers, Docker is
      # available on GitHub-hosted Ubuntu runners).
      - name: cargo test
        run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Security advisories, licenses, duplicate crates, sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Public API changes compared to the latest release on crates.io; fails
  # if the change needs a bigger version bump than Cargo.toml has.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

  # Builds the library and CLI the way a Rust 1.87 user gets them: with the
  # newest dependency versions that still support 1.87 (Cargo.lock tracks
  # latest, see .cargo/config.toml). Tests need Rust 1.88 (dev-dependencies).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: Resolve Rust 1.87 compatible dependencies
        run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - name: cargo check
        run: cargo check --lib --bins

  # Short fuzzing run seeded with the test dumps (see fuzz/). Longer runs:
  # cargo +nightly fuzz run decode -- -max_total_time=3600
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the decoder for 2 minutes
        run: |
          mkdir -p fuzz/corpus/decode
          cp tests/dumps/*.rdb tests/dumps/malformed/*.rdb fuzz/corpus/decode/
          cargo fuzz run decode -- -max_total_time=120 -rss_limit_mb=1024 -malloc_limit_mb=512 -max_len=65536
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
