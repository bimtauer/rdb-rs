name: Python CD

# Publishes rdb-py to PyPI via trusted publishing. The PyPI trusted publisher
# is bound to this file name and the `release` environment (v* tags only,
# required approval). Wheels come from python-ci.yaml run on the tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/python-ci.yaml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: release
      url: https://pypi.org/project/rdb-py/
    permissions:
      # Trusted publishing and artifact attestation
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
      - name: Check tag matches the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for file in wheels-*/*; do
            name=$(basename "$file")
            case "$name" in
              "rdb_py-${version}-"*.whl | "rdb_py-${version}.tar.gz") echo "ok: $name" ;;
              *) echo "::error::$name does not match tag $TAG"; exit 1 ;;
            esac
          done
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'wheels-*/*'
